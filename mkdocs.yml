site_name: The Mechanism
site_description: >-
  Technical documentation for a research cluster built from found hardware as an exercise in
  critical technical practice.
site_author: James Smithies
site_url: https://jamessmithies.github.io/the-mechanism-project/
repo_url: https://github.com/jamessmithies/the-mechanism-project
repo_name: the-mechanism-project

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why build it this way: why.md
  - How it works: how-it-works.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - About: about.md
