site_name: The Mechanism
site_description: >-
  Technical documentation for a research cluster built from found hardware as an exercise in
  critical technical practice.
site_author: James Smithies
site_url: https://jamessmithies.github.io/the-mechanism-project/
repo_url: https://github.com/jamessmithies/the-mechanism-project
repo_name: the-mechanism-project

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why build it this way: why.md
  - About: about.md
