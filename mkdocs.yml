site_name: The Mechanism
site_description: >-
  Technical documentation for a research cluster built from found hardware as an exercise in
  critical technical practice.
site_author: James Smithies
site_url: https://jamessmithies.github.io/the-mechanism-project/
repo_url: https://github.com/jamessmithies/the-mechanism-project
repo_name: the-mechanism-project
copyright: >-
  © 2026 James Smithies, Australian National University.<br>
  Text licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> ·
  site code under <a href="https://github.com/jamessmithies/the-mechanism-project/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - content.code.copy
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/citation.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why TM was built this way: why.md
  - How TM works: how-it-works.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - About Me: about.md

extra:
  generator: false
  analytics:
    provider: custom
    goatcounter_code: jamessmithies
  citation:
    site_title: The Mechanism (TM)
    author_family: Smithies
    author_given: James
    date: "2026-10-30"
